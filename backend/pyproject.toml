[project]
name = "irvinehacks2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "pyproj>=3.7.2",
    "redis>=6.4.0",
    "python-dotenv>=1.2.1",
    "shapely>=2.1.2",
    "uvicorn>=0.41.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "google-genai>=2.10.0",
    "pyjwt>=2.11.0",
    "litellm>=1.82.0",
    "langgraph>=1.2.6",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "langsmith>=0.1.0",
    "tenacity>=9.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "pgvector>=0.3.6",
    "supabase>=2.13.0",
    "upstash-redis>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.16",
    "mypy>=1.19.1",
    "types-shapely>=2.1.0.20250917",
    "cryptography>=46.0.0",
    "types-redis>=4.6.0.20241004",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
# Anchor discovery to tests/ so every test_*.py there (incl. newly added files)
# is collected deterministically regardless of where pytest is invoked from.
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agent", ".agents"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true
