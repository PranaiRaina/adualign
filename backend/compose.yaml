# Local backend environment: FastAPI app + Local Redis Fallback.
# Run from the root of Plotalign-Backend/:
#   docker compose up --build

name: plotalign-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # We remove the hardcoded local REDIS_URL from here.
    # Your local .env file should explicitly dictate whether it points to Upstash or localhost:6379.
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
